field.field.*.*.*.third_party.neo_site_settings:
  type: mapping
  label: 'Shortcut settings'
  mapping:
    config_name:
      type: string
      label: Config Name
    config_key:
      type: string
      label: Config Key
    config_delimiter:
      type: string
      label: Config Delimiter

neo_site_settings.neo_site_settings_type.*:
  type: config_entity
  label: 'Site Settings type config'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Label'
    weight:
      type: integer
      label: Weight
    aggregate:
      type: boolean
      label: Aggregate

block.settings.neo_site_settings:
  type: block_settings
  label: 'Site Settings block'
  mapping:
    site_settings_type:
      type: string
      label: 'Type'
    site_settings_view_mode:
      type: string
      label: 'View Mode'

block.settings.neo_site_settings_field:
  type: block_settings
  label: 'Site Settings fields block'
  mapping:
    site_settings_fields:
      type: sequence
      label: 'Fields'
      sequence:
        type: string
    site_settings_view_mode:
      type: string
      label: 'View Mode'
